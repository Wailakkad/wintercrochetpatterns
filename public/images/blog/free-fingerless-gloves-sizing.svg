<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Fingerless gloves sizing guide placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8D7E5"/>
      <stop offset="1" stop-color="#E9E2FF"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="150" cy="180" r="105" fill="#FFF7EF" opacity="0.8"/>
  <circle cx="1460" cy="840" r="140" fill="#DFF7EF" opacity="0.65"/>

  <rect x="130" y="130" width="1340" height="740" rx="48" fill="#FFFFFF" stroke="#F8D7E5" stroke-width="4"/>

  <!-- stylized glove -->
  <g transform="translate(640 500)" fill="#FFF5F9" stroke="#7A3E55" stroke-width="10" stroke-linejoin="round">
    <path d="M-140 -40
             q 0 -190 90 -190
             q 40 0 55 45
             q 12 -60 60 -60
             q 46 0 54 70
             q 14 -50 58 -50
             q 44 0 48 66
             q 12 -34 46 -34
             q 42 0 44 78
             v 120
             q 0 150 -110 178
             q -60 16 -130 16
             q -165 0 -165 -175
             z"/>
    <!-- cuff band -->
    <path d="M-140 110 q 60 40 200 34" fill="none" stroke-dasharray="18 14"/>
  </g>

  <!-- thumb hole -->
  <circle cx="900" cy="560" r="32" fill="#FFFFFF" stroke="#7A3E55" stroke-width="8" stroke-dasharray="14 12"/>

  <!-- measure callouts -->
  <g stroke="#7A3E55" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M480 400 L 780 400"/>
    <path d="M480 384 L 480 416"/>
    <path d="M780 384 L 780 416"/>
    <path d="M1080 320 L 1080 740"/>
    <path d="M1064 320 L 1096 320"/>
    <path d="M1064 740 L 1096 740"/>
    <path d="M480 760 L 700 760"/>
    <path d="M480 744 L 480 776"/>
    <path d="M700 744 L 700 776"/>
  </g>

  <g font-family="Inter, 'Segoe UI', sans-serif" font-size="28" font-weight="600" fill="#7A3E55">
    <rect x="500" y="354" width="270" height="46" rx="12" fill="#FFFFFF" stroke="#F8D7E5" stroke-width="3"/>
    <text x="635" y="386" text-anchor="middle">Palm 7.5–9 in</text>

    <rect x="990" y="512" width="190" height="46" rx="12" fill="#FFFFFF" stroke="#F8D7E5" stroke-width="3"/>
    <text x="1085" y="544" text-anchor="middle">Length</text>

    <rect x="494" y="714" width="250" height="46" rx="12" fill="#FFFFFF" stroke="#F8D7E5" stroke-width="3"/>
    <text x="619" y="746" text-anchor="middle">Wrist 6–8 in</text>
  </g>

  <text x="800" y="818" text-anchor="middle" font-family="Fredoka, 'Segoe UI', sans-serif" font-size="42" font-weight="700" fill="#7A3E55">Measure Before You Hook</text>
  <text x="800" y="866" text-anchor="middle" font-family="Inter, 'Segoe UI', sans-serif" font-size="22" fill="#7A3E55" opacity="0.55">Sizing image placeholder</text>
</svg>
