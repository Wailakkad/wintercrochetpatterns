<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Materials flatlay placeholder for crochet hand warmers">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF7EF"/>
      <stop offset="1" stop-color="#F8D7E5"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="170" cy="170" r="110" fill="#E9E2FF" opacity="0.6"/>
  <circle cx="1450" cy="850" r="150" fill="#DFF7EF" opacity="0.6"/>

  <!-- flatlay mat -->
  <rect x="140" y="140" width="1320" height="720" rx="48" fill="#FFFFFF" stroke="#F8D7E5" stroke-width="4"/>

  <!-- yarn ball -->
  <g transform="translate(430 400)">
    <circle r="110" fill="#FFF5F9" stroke="#7A3E55" stroke-width="12"/>
    <g fill="none" stroke="#7A3E55" stroke-width="10" stroke-linecap="round">
      <path d="M-92 -52 C -32 -92, 32 -26, 92 -60"/>
      <path d="M-104 6 C -36 -26, 36 28, 104 -4"/>
      <path d="M-92 66 C -28 36, 32 88, 92 56"/>
    </g>
    <path d="M108 14 C 180 60, 240 40, 300 78" fill="none" stroke="#7A3E55" stroke-width="8" stroke-linecap="round" stroke-dasharray="16 14"/>
  </g>

  <!-- crochet hook -->
  <g transform="translate(760 640) rotate(-32)">
    <rect x="-300" y="-14" width="470" height="24" rx="12" fill="#E9E2FF" stroke="#7A3E55" stroke-width="6"/>
    <path d="M170 -12 C 210 -12, 236 -34, 232 -66 L 214 -66 C 216 -46, 198 -34, 172 -34 Z" fill="#FFF5F9" stroke="#7A3E55" stroke-width="6"/>
  </g>

  <!-- scissors -->
  <g transform="translate(1170 330)" stroke="#7A3E55" stroke-width="10" fill="none" stroke-linecap="round">
    <path d="M-70 -80 L 60 70"/>
    <path d="M70 -80 L -60 70"/>
    <circle cx="-84" cy="96" r="30" fill="#FFF5F9"/>
    <circle cx="84" cy="96" r="30" fill="#FFF5F9"/>
  </g>

  <!-- tape measure -->
  <g transform="translate(1160 640)">
    <rect x="-160" y="-40" width="320" height="80" rx="40" fill="#DFF7EF" stroke="#7A3E55" stroke-width="8"/>
    <g stroke="#7A3E55" stroke-width="6" stroke-linecap="round">
      <path d="M-110 -40 L -110 -14"/>
      <path d="M-60 -40 L -60 -6"/>
      <path d="M-10 -40 L -10 -14"/>
      <path d="M40 -40 L 40 -6"/>
      <path d="M90 -40 L 90 -14"/>
    </g>
  </g>

  <text x="800" y="800" text-anchor="middle" font-family="Fredoka, 'Segoe UI', sans-serif" font-size="46" font-weight="700" fill="#7A3E55">Yarn · Hook · Notions</text>
  <text x="800" y="856" text-anchor="middle" font-family="Inter, 'Segoe UI', sans-serif" font-size="24" fill="#7A3E55" opacity="0.55">Materials flatlay placeholder</text>
</svg>
