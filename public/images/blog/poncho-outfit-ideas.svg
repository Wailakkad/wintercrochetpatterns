<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Styling illustration of a crochet poncho outfit layered over a dress with boots">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF7EF"/>
      <stop offset="1" stop-color="#E9E2FF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="115" cy="115" r="72" fill="#F8D7E5" opacity="0.7"/>
  <circle cx="1090" cy="572" r="92" fill="#DFF7EF" opacity="0.6"/>

  <!-- figure with poncho -->
  <g stroke="#7A3E55" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="330" cy="150" r="52" fill="#FFF5F9"/>
    <path d="M300 240 L258 268 C244 277 240 295 248 310 L286 372 L268 545 C266 560 278 572 293 572 L367 572 C382 572 394 560 392 545 L374 372 L412 310 C420 295 416 277 402 268 L360 240 Z" fill="#F8D7E5"/>
    <path d="M300 240 C312 258 348 258 360 240"/>
    <path d="M270 470 C304 490 356 490 390 470" stroke-dasharray="13 11" stroke-width="6"/>
    <path d="M296 572 L292 620 M364 572 L368 620"/>
  </g>

  <!-- styling formulas list -->
  <g font-family="Inter, 'Segoe UI', sans-serif" fill="#7A3E55">
    <text x="560" y="180" font-family="Fredoka, 'Segoe UI', sans-serif" font-size="36" font-weight="700">5 Outfit Formulas</text>
    <g font-size="23">
      <text x="560" y="245">1 · Jeans + tee + ankle boots</text>
      <text x="560" y="305">2 · Belted over trousers</text>
      <text x="560" y="365">3 · Knit dress + knee boots</text>
      <text x="560" y="425">4 · Hoodie + leggings weekend</text>
      <text x="560" y="485">5 · Scarf set, gift-ready</text>
    </g>
    <text x="560" y="560" font-size="19" opacity="0.55">Styling illustration placeholder</text>
  </g>
</svg>
