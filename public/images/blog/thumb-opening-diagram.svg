<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Thumb opening diagram: chain the same number you skip">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF7EF"/>
      <stop offset="1" stop-color="#F8D7E5"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="170" cy="170" r="100" fill="#E9E2FF" opacity="0.6"/>
  <circle cx="1450" cy="850" r="130" fill="#DFF7EF" opacity="0.6"/>

  <rect x="140" y="130" width="1320" height="740" rx="48" fill="#FFFFFF" stroke="#F8D7E5" stroke-width="4"/>

  <!-- glove tube -->
  <g transform="translate(700 500)">
    <rect x="-330" y="-180" width="660" height="360" rx="90" fill="#FFF5F9" stroke="#7A3E55" stroke-width="10"/>
    <!-- stitch grid -->
    <g stroke="#F8D7E5" stroke-width="6" stroke-linecap="round">
      <path d="M-280 -110 L 280 -110"/>
      <path d="M-280 -40 L 280 -40"/>
      <path d="M-280 30 L 280 30"/>
      <path d="M-280 100 L 280 100"/>
    </g>
    <!-- thumb opening -->
    <circle cx="180" cy="-160" r="52" fill="#FFFFFF" stroke="#7A3E55" stroke-width="10" stroke-dasharray="18 14"/>
  </g>

  <!-- chain / skip callout arrows -->
  <g stroke="#7A3E55" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M1010 300 C 1080 340, 1100 380, 1085 425"/>
    <path d="M1085 425 L 1068 396"/>
    <path d="M1085 425 L 1108 398"/>
    <path d="M470 300 C 400 340, 380 380, 395 425"/>
    <path d="M395 425 L 412 396"/>
    <path d="M395 425 L 372 398"/>
  </g>

  <g font-family="Inter, 'Segoe UI', sans-serif" font-size="34" font-weight="600" fill="#7A3E55">
    <rect x="940" y="230" width="240" height="60" rx="16" fill="#FFF5F9" stroke="#F8D7E5" stroke-width="3"/>
    <text x="1060" y="270" text-anchor="middle">chain X</text>

    <rect x="400" y="230" width="240" height="60" rx="16" fill="#FFF5F9" stroke="#F8D7E5" stroke-width="3"/>
    <text x="520" y="270" text-anchor="middle">skip X</text>
  </g>

  <text x="800" y="812" text-anchor="middle" font-family="Fredoka, 'Segoe UI', sans-serif" font-size="42" font-weight="700" fill="#7A3E55">Chain the Same Number You Skip</text>
</svg>
