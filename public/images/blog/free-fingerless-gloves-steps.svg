<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Free fingerless gloves pattern steps placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF7EF"/>
      <stop offset="1" stop-color="#E9E2FF"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="160" cy="840" r="110" fill="#F8D7E5" opacity="0.7"/>
  <circle cx="1450" cy="160" r="95" fill="#DFF7EF" opacity="0.7"/>

  <rect x="120" y="120" width="1360" height="760" rx="48" fill="#FFFFFF" stroke="#F8D7E5" stroke-width="4"/>

  <!-- 5 step cards -->
  <g font-family="Inter, 'Segoe UI', sans-serif" font-size="26" font-weight="600" fill="#7A3E55">
    <g>
      <rect x="180" y="220" width="360" height="240" rx="28" fill="#FFF5F9" stroke="#F8D7E5" stroke-width="3"/>
      <circle cx="240" cy="285" r="34" fill="#7A3E55"/>
      <text x="240" y="296" text-anchor="middle" fill="#FFFFFF" font-size="30" font-weight="700">1</text>
      <rect x="300" y="268" width="180" height="16" rx="8" fill="#F8D7E5"/>
      <rect x="300" y="300" width="130" height="16" rx="8" fill="#FCE6F0"/>
      <rect x="220" y="350" width="280" height="16" rx="8" fill="#F5EDE6"/>
      <rect x="220" y="384" width="240" height="16" rx="8" fill="#F5EDE6"/>
      <text x="360" y="435" text-anchor="middle">Make cuffs</text>
    </g>
    <g>
      <rect x="620" y="220" width="360" height="240" rx="28" fill="#FFF5F9" stroke="#F8D7E5" stroke-width="3"/>
      <circle cx="680" cy="285" r="34" fill="#7A3E55"/>
      <text x="680" y="296" text-anchor="middle" fill="#FFFFFF" font-size="30" font-weight="700">2</text>
      <rect x="740" y="268" width="180" height="16" rx="8" fill="#F8D7E5"/>
      <rect x="740" y="300" width="130" height="16" rx="8" fill="#FCE6F0"/>
      <rect x="660" y="350" width="280" height="16" rx="8" fill="#F5EDE6"/>
      <rect x="660" y="384" width="240" height="16" rx="8" fill="#F5EDE6"/>
      <text x="800" y="435" text-anchor="middle">Join tube</text>
    </g>
    <g>
      <rect x="1060" y="220" width="360" height="240" rx="28" fill="#FFF5F9" stroke="#F8D7E5" stroke-width="3"/>
      <circle cx="1120" cy="285" r="34" fill="#7A3E55"/>
      <text x="1120" y="296" text-anchor="middle" fill="#FFFFFF" font-size="30" font-weight="700">3</text>
      <rect x="1180" y="268" width="180" height="16" rx="8" fill="#F8D7E5"/>
      <rect x="1180" y="300" width="130" height="16" rx="8" fill="#FCE6F0"/>
      <rect x="1100" y="350" width="280" height="16" rx="8" fill="#F5EDE6"/>
      <rect x="1100" y="384" width="240" height="16" rx="8" fill="#F5EDE6"/>
      <text x="1240" y="435" text-anchor="middle">Work rounds</text>
    </g>
    <g>
      <rect x="400" y="520" width="360" height="240" rx="28" fill="#FFF5F9" stroke="#F8D7E5" stroke-width="3"/>
      <circle cx="460" cy="585" r="34" fill="#7A3E55"/>
      <text x="460" y="596" text-anchor="middle" fill="#FFFFFF" font-size="30" font-weight="700">4</text>
      <rect x="520" y="568" width="180" height="16" rx="8" fill="#F8D7E5"/>
      <rect x="520" y="600" width="130" height="16" rx="8" fill="#FCE6F0"/>
      <rect x="440" y="650" width="280" height="16" rx="8" fill="#F5EDE6"/>
      <rect x="440" y="684" width="240" height="16" rx="8" fill="#F5EDE6"/>
      <text x="580" y="735" text-anchor="middle">Thumb opening</text>
    </g>
    <g>
      <rect x="840" y="520" width="360" height="240" rx="28" fill="#FFF5F9" stroke="#F8D7E5" stroke-width="3"/>
      <circle cx="900" cy="585" r="34" fill="#7A3E55"/>
      <text x="900" y="596" text-anchor="middle" fill="#FFFFFF" font-size="30" font-weight="700">5</text>
      <rect x="960" y="568" width="180" height="16" rx="8" fill="#F8D7E5"/>
      <rect x="960" y="600" width="130" height="16" rx="8" fill="#FCE6F0"/>
      <rect x="880" y="650" width="280" height="16" rx="8" fill="#F5EDE6"/>
      <rect x="880" y="684" width="240" height="16" rx="8" fill="#F5EDE6"/>
      <text x="1020" y="735" text-anchor="middle">Finish &amp; weave</text>
    </g>
  </g>

  <text x="800" y="836" text-anchor="middle" font-family="Fredoka, 'Segoe UI', sans-serif" font-size="38" font-weight="700" fill="#7A3E55">Five Simple Steps</text>
  <text x="800" y="884" text-anchor="middle" font-family="Inter, 'Segoe UI', sans-serif" font-size="22" fill="#7A3E55" opacity="0.55">Steps image placeholder</text>
</svg>
